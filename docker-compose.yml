services:
  postgres:
    image: postgres:16-alpine
    container_name: wahaj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wahaj_store
    ports:
      - "5432:5432"
    volumes:
      - wahaj_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wahaj_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wahaj_postgres_data:
